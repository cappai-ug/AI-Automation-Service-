<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for logo mark -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Network nodes -->
  <g transform="translate(100, 100)">
    <!-- Top node -->
    <circle cx="0" cy="-35" r="12" fill="#2563EB"/>

    <!-- Right node -->
    <circle cx="30" cy="20" r="12" fill="#2563EB"/>

    <!-- Bottom node -->
    <circle cx="0" cy="45" r="12" fill="#2563EB"/>

    <!-- Left node -->
    <circle cx="-30" cy="20" r="12" fill="#2563EB"/>

    <!-- Connection lines -->
    <path d="M 0,-35 Q 20,-10 30,20" stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 30,20 Q 15,35 0,45" stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 0,45 Q -15,35 -30,20" stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -30,20 Q -20,-10 0,-35" stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
