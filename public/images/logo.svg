<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Network Icon -->
  <g transform="translate(80, 100)">
    <!-- Connection lines with gradient -->
    <path d="M -25,-30 Q -10,-5 25,-15" stroke="url(#lineGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 25,-15 Q 35,10 20,35" stroke="url(#lineGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 20,35 Q 0,25 -25,20" stroke="url(#lineGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -25,20 Q -35,0 -25,-30" stroke="url(#lineGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Nodes -->
    <circle cx="-25" cy="-30" r="11" fill="#2563EB"/>
    <circle cx="25" cy="-15" r="11" fill="#2563EB"/>
    <circle cx="20" cy="35" r="11" fill="#2563EB"/>
    <circle cx="-25" cy="20" r="11" fill="#2563EB"/>
  </g>

  <!-- Text "OPTIMIZED" with outline stroke -->
  <text x="220" y="130" font-family="Arial, sans-serif" font-size="72" font-weight="bold" letter-spacing="3" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">OPTIMIZED</text>
</svg>
